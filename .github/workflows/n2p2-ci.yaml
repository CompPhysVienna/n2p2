name: n2p2-ci
on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    # Pinned LTS image: ubuntu-latest moves to a new release without notice.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install required system packages
        run: |
          # Docs
          # API docs with doxygen (built via makefile, needs cmake),
          # generating graphs with doxygen requires dot.
          sudo apt install cmake graphviz

          # Build 
          # MPI
          sudo apt install openmpi-bin libopenmpi-dev
          # BLAS
          sudo apt install libblas3 libblas-dev
          # OpenBLAS
          sudo apt install libopenblas0 libopenblas-dev
          # Eigen library
          sudo apt install libeigen3-dev
          # GSL library
          sudo apt install libgsl-dev libgslcblas0

          # Tests
          # Boost Test for C++ testing
          sudo apt install libboost-test-dev libboost-filesystem-dev
          # Coverage for C++
          sudo apt install lcov
      
      - name: Install required Python packages
        run: |
          # Docs
          pip install sphinx
          pip install sphinx_rtd_theme
          pip install breathe

          # pynnp
          pip install cython==3.0.11

          # python tests
          pip install pytest #==7.1.3
          pip install pytest-cov #==4.0.0
          pip install coverage #==7.6.1

      - name: Build n2p2 libraries and applications
        id: build
        run: make MODE=test -j4
        working-directory: ./src
      
      - name: Build documentation
        run: |
          # Pre-build doxygen only on 4 cores (-j hangs on Github Actions).
          cd doc/doxygen/
          make CORES=4 doxygen
          cd ../..
          # Now build the rest of the documentation.
          make doc
          # Prevent GitHub Jekyll to interfere with Sphinx theme.
          touch ../doc/sphinx/html/.nojekyll
        working-directory: ./src
      
      - name: Build LAMMPS with n2p2 support
        id: lammps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make MODE=test lammps-hdnnp
        working-directory: ./src
      
      # The test steps run whenever what they need was built, also after a
      # failure in an earlier step, and make -k runs all tests of a step
      # even if one fails: one CI run reports every failing test.
      # Tests are compiled and run in parallel, -O keeps the output of each
      # test together. Multi-rank tests (test_Training_mpi, nnp-comp2 compare
      # mode) may need more MPI slots than the runner reports, hence
      # --oversubscribe.
      - name: Run C++ unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -k -j $(nproc) -O unit MPIRUN="mpirun --oversubscribe"
        working-directory: ./test/cpp

      - name: Run C++ application regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -k -j $(nproc) -O tools MPIRUN="mpirun --oversubscribe"
        working-directory: ./test/cpp

      - name: Run LAMMPS interface regression test
        if: ${{ !cancelled() && steps.lammps.outcome == 'success' }}
        run: make -k interface
        working-directory: ./test/cpp

      - name: Collect C++ coverage
        id: cppcoverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          make coverage
          rm -f *.gcda *.gcno
        working-directory: ./test/cpp
      
      - name: Build pynnp
        id: pynnp
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make pynnp MODE=test
        working-directory: ./src
      
      - name: Run python tests
        if: ${{ !cancelled() && steps.pynnp.outcome == 'success' }}
        run: make python
        working-directory: ./test
      
      - name: Upload C++ coverage to Codecov
        if: ${{ !cancelled() && steps.cppcoverage.outcome == 'success' }}
        uses: codecov/codecov-action@v2
        with:
          files: test/cpp/tests.info
          flags: cpp
          verbose: true
      
      - name: Upload Python coverage to Codecov
        if: ${{ !cancelled() && steps.pynnp.outcome == 'success' }}
        uses: codecov/codecov-action@v2
        with:
          directory: test/python
          flags: python
          verbose: true

      - name: Deploy Github pages
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: gh-pages
          folder: doc/sphinx/html
